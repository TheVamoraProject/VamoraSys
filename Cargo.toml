[package]
name = "vamorasys"
version = "0.1.0"
edition = "2021"
description = "VamoraSys native Linux configuration middleware CLI"
license = "MIT"

[[bin]]
name = "vamorasys"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.15"